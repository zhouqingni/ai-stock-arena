<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 炒股竞技场</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2; --surface: #fcfcfb; --border: #e3e2de; --grid: #ecebe7;
  --text: #0b0b0b; --text-2: #52514e; --muted: #8a8984;
  --up: #d93a3a; --down: #13914f;           /* A 股习惯：红涨绿跌 */
  --bench: #8a8984; --bench2: #b5b4ae;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --border: #2e2e2c; --grid: #262624;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8d8c86;
    --up: #f06a6a; --down: #3fbf7a; --bench: #8d8c86; --bench2: #5f5e5a;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --border: #2e2e2c; --grid: #262624;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #8d8c86;
  --up: #f06a6a; --down: #3fbf7a; --bench: #8d8c86; --bench2: #5f5e5a;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
h1 { font-size: 18px; margin: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--down); }
.meta { color: var(--muted); font-size: 12px; margin-left: auto; }
main { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card h2 { font-size: 14px; margin: 0 0 12px; color: var(--text-2); font-weight: 600; }
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.agent { border: 1px solid var(--border); border-radius: 10px; padding: 12px; cursor: pointer; background: var(--surface); text-align: left; color: inherit; font: inherit; }
.agent.sel { outline: 2px solid var(--text-2); }
.agent .top { display: flex; align-items: center; gap: 8px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.rank { font-weight: 700; color: var(--muted); }
.agent .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent .ret { font-size: 24px; font-weight: 700; margin: 4px 0 0; font-variant-numeric: tabular-nums; }
.agent .sub { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.up { color: var(--up); } .down { color: var(--down); }
.chart-wrap { position: relative; }
svg text { fill: var(--muted); font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgb(0 0 0 / .12); display: none; min-width: 160px; z-index: 2; }
.tip .row { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.tip .row b { font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 500; }
.scroll { overflow-x: auto; }
.feed { display: grid; gap: 10px; max-height: 520px; overflow-y: auto; }
.item { border-left: 3px solid var(--border); padding: 4px 0 4px 10px; }
.item .t { font-size: 12px; color: var(--muted); }
.item .o { font-size: 12px; margin-top: 4px; }
.err { color: var(--up); }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--border); background: transparent; color: var(--text-2); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px; }
.tabs button.on { background: var(--text); color: var(--surface); border-color: var(--text); }
.empty { color: var(--muted); font-size: 13px; padding: 12px 0; }
#banner:empty { display: none; }
.banner { background: color-mix(in srgb, var(--up) 12%, var(--surface)); border: 1px solid var(--up); color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>🏁 AI 炒股竞技场</h1>
  <span class="pill"><span class="dot" id="m-CN"></span>A股</span>
  <span class="pill"><span class="dot" id="m-JP"></span>日股</span>
  <span class="meta" id="meta">加载中…</span>
</header>
<main>
  <div id="banner"></div>
  <section class="card">
    <h2>排行榜</h2>
    <div class="board" id="board"></div>
  </section>
  <section class="card">
    <h2>收益率走势</h2>
    <div class="legend" id="legend"></div>
    <div class="chart-wrap" id="chartWrap">
      <svg id="chart" width="100%" height="320" role="img" aria-label="各 AI 收益率随时间变化"></svg>
      <div class="tip" id="tip"></div>
    </div>
  </section>
  <div class="two">
    <section class="card">
      <h2 id="detailTitle">选手详情</h2>
      <div class="tabs" id="tabs">
        <button data-t="pos" class="on">持仓</button>
        <button data-t="trades">成交记录</button>
      </div>
      <div class="scroll" id="detail"></div>
    </section>
    <section class="card">
      <h2>AI 思考记录</h2>
      <div class="feed" id="decisions"></div>
    </section>
  </div>
  <section class="card">
    <h2>自选行情</h2>
    <div class="scroll"><table id="quotes"></table></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (n, d = 2) => n == null ? '-' : Number(n).toLocaleString('zh-CN', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (n) => n == null ? '-' : `${n > 0 ? '+' : ''}${fmt(n)}%`;
const cls = (n) => n > 0 ? 'up' : n < 0 ? 'down' : '';
const color = (i) => `var(--s${(i % 8) + 1})`; // 按配置顺序固定分配，不随排名变化
const time = (s) => new Date(s).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });

let state = null, selected = null, tab = 'pos';
try { selected = localStorage.getItem('sel'); tab = localStorage.getItem('tab') || 'pos'; } catch {}

let MODE = null; // 'server'（本地/云服务器）或 'static'（GitHub Pages）
async function getJSON(u) { const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) throw new Error(r.status); return r.json(); }
async function load() {
  try {
    if (MODE !== 'static') {
      try { state = await getJSON('api/state'); MODE = 'server'; } catch (e) { if (MODE === 'server') throw e; MODE = 'static'; }
    }
    if (MODE === 'static') state = await getJSON('data/public.json?t=' + Date.now());
    if (MODE === 'static') state.markets = { CN: isOpen('CN'), JP: isOpen('JP') };
    if (!selected || !state.agents.find((a) => a.id === selected)) selected = state.agents[0]?.id;
    render();
  } catch (e) { $('meta').textContent = MODE === 'static' ? '还没有比赛数据：等 GitHub Actions 跑完第一轮（或在 Actions 页面手动运行一次）' : '连接服务器失败：' + e.message; }
}

const SESS = { CN: ['Asia/Shanghai', [[570, 690], [780, 900]]], JP: ['Asia/Tokyo', [[540, 690], [750, 930]]] };
function isOpen(m) {
  const [tz, ss] = SESS[m];
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date()).map((x) => [x.type, x.value]));
  if (p.weekday === 'Sat' || p.weekday === 'Sun') return false;
  const mins = (Number(p.hour) % 24) * 60 + Number(p.minute);
  return ss.some(([a, b]) => mins >= a && mins < b);
}
const ago = (iso) => { const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 1 ? '刚刚' : m < 60 ? `${m} 分钟前` : m < 1440 ? `${Math.round(m / 60)} 小时前` : `${Math.round(m / 1440)} 天前`; };

function render() {
  const s = state;
  for (const m of ['CN', 'JP']) $('m-' + m).classList.toggle('on', !!s.markets?.[m]);
  $('meta').textContent = `行情源 ${s.dataSource} · 初始资金 ${fmt(s.initialCash, 0)} ${s.baseCurrency} · 开赛 ${time(s.startedAt)} · 数据更新于 ${ago(s.generatedAt)}${MODE === 'static' ? '（交易时段每 10 分钟一轮）' : ''}`;
  $('banner').innerHTML = s.quoteError ? `<div class="banner">行情获取出错：${esc(s.quoteError)}（若在海外可把 dataSource 改成 yahoo；断网调试用 --mock）</div>` : '';

  // 排行榜
  const sorted = [...s.agents].sort((a, b) => a.rank - b.rank);
  $('board').innerHTML = sorted.map((a) => {
    const i = s.agents.indexOf(a);
    const st = s.runner?.[a.id];
    return `<button class="agent ${a.id === selected ? 'sel' : ''}" data-id="${esc(a.id)}">
      <div class="top"><span class="rank">#${a.rank}</span><span class="swatch" style="background:${color(i)}"></span><span class="name">${esc(a.name)}</span></div>
      <div class="ret ${cls(a.returnPct)}">${pct(a.returnPct)}</div>
      <div class="sub"><span>总资产 ${fmt(a.equity, 0)}</span><span>现金 ${fmt(a.cash, 0)}</span></div>
      <div class="sub"><span>最大回撤 ${fmt(a.maxDrawdownPct)}%</span><span>交易 ${a.tradeCount} 笔</span></div>
      <div class="sub"><span>${esc(a.model)}</span>${st?.lastError ? `<span class="err" title="${esc(st.lastError)}">${/API Key/.test(st.lastError) ? '未配置 Key' : '上轮出错'}</span>` : ''}</div>
    </button>`;
  }).join('') + (s.benchmarks || []).map((b, k) => `<div class="agent" style="cursor:default"><div class="top"><span class="swatch" style="background:var(--bench${k ? '2' : ''})"></span><span class="name">基准：${esc(b.name)}</span></div><div class="ret ${cls(b.returnPct)}">${pct(b.returnPct)}</div><div class="sub">买入持有不动的参照收益</div></div>`).join('');
  document.querySelectorAll('.agent[data-id]').forEach((el) => el.onclick = () => { selected = el.dataset.id; try { localStorage.setItem('sel', selected); } catch {} render(); });

  drawChart();
  renderDetail();
}

function renderDetail() {
  const a = state.agents.find((x) => x.id === selected);
  if (!a) return;
  $('detailTitle').textContent = `选手详情 · ${a.name}`;
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === tab));
  if (tab === 'pos') {
    $('detail').innerHTML = a.positions.length ? `<table><tr><th>股票</th><th>数量</th><th>可卖</th><th>成本</th><th>现价</th><th>今日</th><th>浮盈</th><th>市值(${state.baseCurrency})</th></tr>${a.positions.map((p) => `<tr><td>${esc(p.name)}<br><span style="color:var(--muted);font-size:11px">${esc(p.symbol)}</span></td><td>${p.qty}</td><td>${p.sellable}</td><td>${fmt(p.avgCost)}</td><td>${fmt(p.price)}</td><td class="${cls(p.changePct)}">${pct(p.changePct)}</td><td class="${cls(p.pnlPct)}">${pct(p.pnlPct)}</td><td>${fmt(p.valueBase, 0)}</td></tr>`).join('')}<tr><td>现金</td><td colspan="6"></td><td>${fmt(a.cash, 0)}</td></tr></table>` : `<div class="empty">空仓，现金 ${fmt(a.cash, 0)}</div>`;
  } else {
    $('detail').innerHTML = a.trades.length ? `<table><tr><th>时间</th><th>方向</th><th>股票</th><th>数量</th><th>成交价</th><th>金额</th><th>费用</th></tr>${a.trades.map((t) => `<tr title="${esc(t.reason)}"><td>${time(t.time)}</td><td class="${t.side === 'buy' ? 'up' : 'down'}">${t.side === 'buy' ? '买入' : '卖出'}</td><td>${esc(t.name || t.symbol)}</td><td>${t.qty}</td><td>${fmt(t.price)} ${t.currency}</td><td>${fmt(t.amountBase, 0)}</td><td>${fmt(t.fee)}</td></tr>`).join('')}</table>` : '<div class="empty">还没有成交</div>';
  }
  const i = state.agents.indexOf(a);
  $('decisions').innerHTML = a.decisions.length ? a.decisions.map((d) => `<div class="item" style="border-color:${color(i)}">
      <div class="t">${time(d.time)}</div>
      ${d.error ? `<div class="err">出错：${esc(d.error)}</div>` : `<div>${esc(d.analysis) || '<span style="color:var(--muted)">（无说明）</span>'}</div>`}
      <div class="o">${(d.orders || []).map((o) => `<span class="${o.ok ? (o.side === 'buy' ? 'up' : 'down') : 'err'}">${o.side === 'buy' ? '买' : '卖'} ${esc(o.symbol)} ×${esc(o.qty)} ${o.ok ? '✓' : '✗ ' + esc(o.error)}</span>`).join('<br>') || '<span style="color:var(--muted)">本轮不操作</span>'}</div>
    </div>`).join('') : '<div class="empty">还没有决策记录</div>';
}
document.querySelectorAll('#tabs button').forEach((b) => b.onclick = () => { tab = b.dataset.t; try { localStorage.setItem('tab', tab); } catch {} renderDetail(); });

// ---------- 收益率折线图（单一 y 轴：相对初始资金的收益率 %） ----------
function drawChart() {
  const svg = $('chart');
  const W = svg.clientWidth || 800, H = 320;
  const pad = { l: 52, r: W < 600 ? 84 : 130, t: 12, b: 28 };
  const p1 = (v) => (Math.abs(v) < 0.05 ? 0 : v).toFixed(1);
  const init = state.initialCash;
  const series = state.agents.map((a, i) => ({ name: a.name, color: color(i), pts: a.equityHistory.map(([t, v]) => [t, (v / init - 1) * 100]) }));
  (state.benchmarks || []).forEach((b, k) => series.push({ name: '基准 ' + b.name, color: `var(--bench${k ? '2' : ''})`, dash: true, pts: b.history.map(([t, v]) => [t, (v / init - 1) * 100]) }));
  $('legend').innerHTML = series.map((s) => `<span><svg width="18" height="8"><line x1="0" y1="4" x2="18" y2="4" stroke="${s.color}" stroke-width="2" ${s.dash ? 'stroke-dasharray="4 3"' : ''}/></svg>${esc(s.name)}</span>`).join('');
  const all = series.flatMap((s) => s.pts);
  if (all.length < 2) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle">数据积累中（每分钟记录一次净值）…</text>`; return; }
  const t0 = Math.min(...all.map((p) => p[0])), t1 = Math.max(...all.map((p) => p[0])) || t0 + 1;
  let y0 = Math.min(0, ...all.map((p) => p[1])), y1 = Math.max(0, ...all.map((p) => p[1]));
  const span = Math.max(y1 - y0, 0.5); y0 -= span * 0.1; y1 += span * 0.1;
  const X = (t) => pad.l + (t - t0) / Math.max(1, t1 - t0) * (W - pad.l - pad.r);
  const Y = (v) => pad.t + (y1 - v) / (y1 - y0) * (H - pad.t - pad.b);
  let g = '';
  const ticks = 5;
  for (let k = 0; k <= ticks; k++) {
    const v = y0 + (y1 - y0) * k / ticks;
    g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${pad.l - 6}" y="${Y(v) + 4}" text-anchor="end">${p1(v)}%</text>`;
  }
  g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  const xt = W < 600 ? 2 : 4;
  for (let k = 0; k <= xt; k++) {
    const t = t0 + (t1 - t0) * k / xt;
    g += `<text x="${X(t)}" y="${H - 8}" text-anchor="${k === 0 ? 'start' : k === xt ? 'end' : 'middle'}">${time(t)}</text>`;
  }
  // 线 + 末端直接标注（避免重叠：简单地按 y 排序后推开）
  const ends = [];
  for (const s of series) {
    if (!s.pts.length) continue;
    g += `<path d="${s.pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="5 4"' : ''}/>`;
    const last = s.pts.at(-1);
    ends.push({ s, y: Y(last[1]), v: last[1], x: X(last[0]) });
  }
  ends.sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
  for (const e of ends) g += `<circle cx="${e.x}" cy="${Y(e.v)}" r="4" fill="${e.s.color}" stroke="var(--surface)" stroke-width="2"/><text x="${W - pad.r + 8}" y="${e.y + 4}" style="fill:var(--text-2)">${esc(e.s.name.slice(0, W < 600 ? 4 : 8))} ${p1(e.v)}%</text>`;
  g += `<line id="xh" y1="${pad.t}" y2="${H - pad.b}" stroke="var(--muted)" stroke-dasharray="3 3" style="display:none"/><g id="xhDots"></g>`;
  g += `<rect x="${pad.l}" y="${pad.t}" width="${W - pad.l - pad.r}" height="${H - pad.t - pad.b}" fill="transparent" id="hit"/>`;
  svg.innerHTML = g;

  const tip = $('tip');
  $('hit').onmousemove = (ev) => {
    const r = svg.getBoundingClientRect();
    const mx = ev.clientX - r.left;
    const t = t0 + (mx - pad.l) / (W - pad.l - pad.r) * (t1 - t0);
    const rows = series.map((s) => {
      let best = null;
      for (const p of s.pts) if (!best || Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p;
      return best && { s, p: best };
    }).filter(Boolean).sort((a, b) => b.p[1] - a.p[1]);
    if (!rows.length) return;
    const xt = X(rows[0].p[0]);
    const xh = $('xh'); xh.setAttribute('x1', xt); xh.setAttribute('x2', xt); xh.style.display = '';
    $('xhDots').innerHTML = rows.map((r) => `<circle cx="${X(r.p[0])}" cy="${Y(r.p[1])}" r="4" fill="${r.s.color}" stroke="var(--surface)" stroke-width="2"/>`).join('');
    tip.innerHTML = `<div style="color:var(--muted);margin-bottom:4px">${new Date(rows[0].p[0]).toLocaleString('zh-CN')}</div>` + rows.map((r) => `<div class="row"><span style="display:flex;align-items:center;gap:6px"><span class="swatch" style="background:${r.s.color}"></span>${esc(r.s.name)}</span><b class="${cls(r.p[1])}">${pct(r.p[1])}</b></div>`).join('');
    tip.style.display = 'block';
    const tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(0, mx + 14), r.width - tw) + 'px';
    tip.style.top = '10px';
  };
  $('hit').onmouseleave = () => { tip.style.display = 'none'; $('xh').style.display = 'none'; $('xhDots').innerHTML = ''; };
}

// 静态模式：浏览器直接从腾讯行情拉实时价（用 script 标签，免跨域）
function tencentQuotes(syms) {
  return new Promise((resolve) => {
    const sc = document.createElement('script');
    sc.charset = 'gbk';
    sc.src = 'https://qt.gtimg.cn/q=' + syms.join(',') + '&_=' + Date.now();
    const done = () => {
      const out = {};
      for (const sym of syms) {
        const raw = window['v_' + sym];
        if (!raw) continue;
        const f = raw.split('~'), price = +f[3], prev = +f[4];
        if (!price) continue;
        out[sym] = { symbol: sym, name: f[1], price, prevClose: prev, open: +f[5] || null, high: +f[33] || null, low: +f[34] || null, changePct: prev ? +((price - prev) / prev * 100).toFixed(2) : null };
      }
      sc.remove(); resolve(out);
    };
    sc.onload = done; sc.onerror = () => { sc.remove(); resolve({}); };
    document.head.appendChild(sc);
  });
}
async function loadQuotes() {
  if (!state?.watchlist?.length) return;
  try {
    const quotes = MODE === 'static' ? { ...(state.watchQuotes || {}), ...(await tencentQuotes(state.watchlist.filter((x) => !x.startsWith('jp')))) } : (await getJSON('api/quote?symbols=' + state.watchlist.join(','))).quotes;
    const list = state.watchlist.map((s) => quotes[s]).filter(Boolean);
    if (!list.length) return;
    $('quotes').innerHTML = `<tr><th>股票</th><th>代码</th><th>现价</th><th>涨跌幅</th><th>今开</th><th>最高</th><th>最低</th><th>昨收</th></tr>` +
      list.map((q) => `<tr><td>${esc(q.name)}</td><td>${esc(q.symbol)}</td><td class="${cls(q.changePct)}">${fmt(q.price)}</td><td class="${cls(q.changePct)}">${pct(q.changePct)}</td><td>${fmt(q.open)}</td><td>${fmt(q.high)}</td><td>${fmt(q.low)}</td><td>${fmt(q.prevClose)}</td></tr>`).join('');
  } catch {}
}

window.addEventListener('resize', () => state && drawChart());
load().then(loadQuotes);
setInterval(load, 30000);
setInterval(loadQuotes, 10000);
</script>
